# ==============================================================================
# VEID Enterprise - Blueprint Render.com (Plan Gratuit)
# Déploiement optimisé pour l'offre Free Tier de Render
# ==============================================================================

services:
  # 1. Application Web VEID Enterprise (Docker)
  - type: web
    name: veid-enterprise
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /web/login
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: veid-postgres
          property: connectionString
      - key: ADMIN_PASSWD
        generateValue: true

# 2. Base de données PostgreSQL Managée (Free Tier - 1GB max)
databases:
  - name: veid-postgres
    databaseName: monerp
    user: odoo
    plan: free
    region: frankfurt
