services:

  db:
    image: postgres:16
    container_name: veid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monerp}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-monerp}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: veid-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - ./config:/etc/odoo
      - ./odoo/odoo-19.0:/opt/odoo
      - ./custom_addons:/mnt/custom-addons
      - ./oca:/mnt/oca
      - odoo_data:/var/lib/odoo
    command:
      - /opt/odoo/odoo-bin
      - -c
      - /etc/odoo/odoo.conf

  nginx:
    image: nginx:alpine
    container_name: veid-nginx
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: veid-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  odoo_data:
  certbot_etc:
  certbot_var:
  certbot_www:
